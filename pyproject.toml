[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP", "B", "SIM", "RUF"]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "E501",   # long lines are handled by the formatter
  "RUF001", # Škoda and MyŠkoda contain non-ASCII characters on purpose
  "RUF002",
  "RUF003",
  "RUF012", # Home Assistant entity classes use mutable class attributes
  "SIM102",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
